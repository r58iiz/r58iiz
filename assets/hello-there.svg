<!--
https://readme-typing-svg.demolab.com
	?font=Fira+Code
	&weight=600
	&size=22
	&duration=3000
	&pause=1000
	&color=7C3AED
	&width=700
	&lines=Hello+there;I'm+R
-->
<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 700 50' style='background-color: #00000000;' width='700px' height='50px'>
    <style>
        @font-face {
            font-family: 'Fira Code';
            font-style: normal;
            font-weight: 600;
            font-display: fallback;
            src: url(data:font/truetype;base64,) format('truetype');
        }
    </style>
    <path id='path0'>
        <!-- Single line -->
        <animate id='d0' attributeName='d' begin='0s;d1.end' dur='4000ms' fill='remove' values='m0,25 h0 ; m0,25 h700 ; m0,25 h700 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Fira Code", monospace' fill='#7C3AED' font-size='22' dominant-baseline='auto' x='0%' text-anchor='start' letter-spacing='normal'>
        <textPath xlink:href='#path0'> Hello there </textPath>
    </text>
    <path id='path1'>
        <!-- Single line -->
        <animate id='d1' attributeName='d' begin='d0.end' dur='4000ms' fill='remove' values='m0,25 h0 ; m0,25 h700 ; m0,25 h700 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Fira Code", monospace' fill='#7C3AED' font-size='22' dominant-baseline='auto' x='0%' text-anchor='start' letter-spacing='normal'>
        <textPath xlink:href='#path1'> I&#039;m R </textPath>
    </text>
</svg>
