<svg width="300" height="78" viewBox="0 0 300 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
	<title id="t">Blog</title>
	<desc id="d">
		Visit r58iiz.github.io/blog
	</desc>

	<style>
		.card { fill: #f6f8fa; stroke: #d0d7de; }
